name: Deploy to OVH

# Builds the site and uploads it to /aurelien.pautet.net on the OVH FTP server.
# Upload only: nothing on the server is ever deleted, so the other projects
# living in that folder (MindCap, SiteGallery, JsGame*, ...) are never touched.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

env:
  REMOTE_DIR: /aurelien.pautet.net
  # Top-level entries of dist/ this workflow is allowed to write on the server.
  # If you add a new folder to public/, add it here, after checking that no
  # other project on the server already uses that name.
  ALLOWED_ENTRIES: "index.html assets fonts logos openGraph projectThumbnails favicon.png favicon-32.png logo.png"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check dist only contains allowed entries
        run: |
          find dist -name .DS_Store -delete
          bad=0
          for entry in $(ls -A dist); do
            case " $ALLOWED_ENTRIES " in
              *" $entry "*) ;;
              *) echo "::error::dist/$entry is not in ALLOWED_ENTRIES; refusing to upload it next to other projects"; bad=1 ;;
            esac
          done
          exit $bad

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload (no deletion)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Assets first, index.html last, so the live page never points at
          # files that are not uploaded yet. `mirror -R` without --delete only
          # adds and overwrites; it never removes anything on the server.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --verbose --no-perms --parallel=4 --exclude-glob index.html dist "$REMOTE_DIR"
          put dist/index.html -o "$REMOTE_DIR/index.html"
          bye
          EOF
